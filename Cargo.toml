[package]
name = "mod-net-sensor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2.191"
pcap = "2.5.0"
prost = "0.14.4"
prost-types = "0.14.4"
psychoscope-proto = { git = "https://github.com/psychoscope-io/psychoscope-proto", tag = "v0.1.0" }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt", "macros", "io-util", "net", "signal", "time", "rt-multi-thread", "sync"] }

[dev-dependencies]
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
