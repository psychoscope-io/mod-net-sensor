[package]
name = "mod-net-sensor"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2.191"
pcap = "2.5.0"
prost = "0.14.4"
prost-types = "0.14.4"
psychoscope-proto = { git = "https://github.com/psychoscope-io/psychoscope-proto", tag = "v0.4.0", version = "0.1" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util", "net", "signal", "time", "rt-multi-thread", "sync"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
strip = true
lto = "thin"

[[bench]]
name = "hot_path"
harness = false
