[package]
name = "mod-net-sensor"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
prost = "0.14.4"
psychoscope-proto = { version = "0.1.0", path = "../psychoscope-proto/rust" }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt", "macros", "io-util", "net", "signal", "time"] }

[dev-dependencies]
proptest = "1.12.0"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
