[package]
name = "mod-net-sensor-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.12"
mod-net-sensor = { path = ".." }
tokio = { version = "1.54.0", features = ["rt"] }

# Fora do workspace do sensor: o fuzz exige nightly e nao deve afetar `cargo build/test` do crate.
[workspace]

[[bin]]
name = "decode_frame"
path = "fuzz_targets/decode_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_dns"
path = "fuzz_targets/parse_dns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_client_hello"
path = "fuzz_targets/parse_client_hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_frame"
path = "fuzz_targets/read_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reassembler"
path = "fuzz_targets/reassembler.rs"
test = false
doc = false
bench = false
