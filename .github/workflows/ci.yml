name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # psychoscope-proto fica ao lado (dependencia por path no desenvolvimento)
      - uses: actions/checkout@v4
        with: { repository: Bandeira27/psychoscope-proto, path: ../psychoscope-proto }
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
